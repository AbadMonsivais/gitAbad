<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de lugares</title>
    <link rel="stylesheet" href="style2.css">
</head>

<body>
    <div class="contenedor">
        <h1> Buscar lugares</h1>

        <div class="busqueda">
            <input type="text" placeholder="Buscar lugar" id="lugar">
            <input type="submit" value="Buscar" id="buscar">
        </div>

        <div id="resultados"></div>
    </div>

    <script>
        const inputLugar = document.getElementById("lugar");
        const botonBuscar = document.getElementById("buscar");
        const resultados = document.getElementById("resultados");

        async function buscarLugar(){
            const lugar = inputLugar.value.trim();
            
            if(!lugar){
                resultados.innerHTML = 'Ingresa nombre valido';
                return;
            }

            const respuesta = await fetch(
                `https://geocoding-api.open-meteo.com/v1/search?name=${lugar}&count=1&language=es&format=json`
            );

            const data = await respuesta.json();
            const ciudad = data.results[0];

            resultados.innerHTML = `
                <h2>${ciudad.name}</h2>
                <ul>
                    <li>Pais: ${ciudad.country}</li>
                    <li>Estado: ${ciudad.admin1}</li>
                    <li>Latitud: ${ciudad.latitude}</li>
                    <li>Longitud: ${ciudad.longitude}</li>
                </ul>
            `;

            console.log(ciudad);
        }

        botonBuscar.addEventListener("click", buscarLugar);
    </script>
</body>
</html>
